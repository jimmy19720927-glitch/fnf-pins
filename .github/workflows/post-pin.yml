name: Post Pin

on:
  schedule:
    # 每天 3 發，每次發 queue 最前面 1 張
    # UTC 00/02/04 = 台灣 08:00/10:00/12:00 = 美東 20:00/22:00/00:00（前一天）= 美西 17:00/19:00/21:00
    # 2026-08-05 從 UTC 04/08/13（台灣 12/16/21）改過來：舊時段對應印度早/午/晚，
    # 導致受眾 16.4% 印度、只有 9.3% 美國，而站上推的是 Amazon.com 美國站 → CTR 9~20% 卻 0 轉換。
    # 新時段瞄準美東 20:00~23:00（Pinterest 尖峰）。演算法轉向約需 2~4 週。
    # 2026-08-07 從 '0 0,2,4' 改成 '7 0,2,4'：連 3 天(08-05~08-07) UTC 00:00 那班
    # 完全沒觸發過(GH Actions 對整點 cron 常擠壓丟棄)，導致每天少發 1/3 的 Pin。
    - cron: '7 0,2,4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-pin
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post next queued pin via Make.com
        env:
          MAKE_TOKEN: ${{ secrets.MAKE_TOKEN }}
        run: python3 scripts/post_pin.py
      - name: Commit queue state
        run: |
          git config user.name "fnf-pins bot"
          git config user.email "actions@github.com"
          git add queue posted
          git diff --cached --quiet || git commit -m "pin posted $(date -u +%Y-%m-%d)"
          git push
