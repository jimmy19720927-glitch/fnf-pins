name: Post Pin

on:
  schedule:
    # 每天 3 發，每次發 queue 最前面 1 張
    # UTC 00/02/04 = 台灣 08:00/10:00/12:00 = 美東 20:00/22:00/00:00（前一天）= 美西 17:00/19:00/21:00
    # 2026-08-05 從 UTC 04/08/13（台灣 12/16/21）改過來：舊時段對應印度早/午/晚，
    # 導致受眾 16.4% 印度、只有 9.3% 美國，而站上推的是 Amazon.com 美國站 → CTR 9~20% 卻 0 轉換。
    # 新時段瞄準美東 20:00~23:00（Pinterest 尖峰）。演算法轉向約需 2~4 週。
    # 2026-08-07 從 '0 0,2,4' 改成 '7 0,2,4'：連 3 天(08-05~08-07) UTC 00:00 那班
    # 完全沒觸發過(GH Actions 對整點 cron 常擠壓丟棄)，導致每天少發 1/3 的 Pin。
    # 2026-08-10 再修：改成 :07 分之後，08-08/08-09 那班「還是」沒觸發（連 5 天全滅）。
    # 結論是問題不在「整點」而在「UTC 00 點這個時段」本身就是全球最壅塞的排程時段，
    # 免費額度的排程會被直接丟棄而非延後。把它前移到 UTC 23:37（前一天）：
    # 時段冷門得多，換算美東 19:37 仍在 Pinterest 晚間尖峰內，不犧牲受眾策略。
    # 2026-08-12 第二次修：第一班(23:37)實測延遲僅 26~32 分，落點美東 20:00 附近，很準。
    # 但後兩班被延遲吃掉了 —— 08-11 實際落點：UTC 02:07 那班延到 03:51(延遲 104 分)=美東 23:51、
    # UTC 04:07 那班延到 05:17(延遲 70 分)=美東 01:17，第三張 Pin 固定發在美國半夜，等於白發。
    # 對策：不跟延遲對抗，改成「就算延遲 100 分鐘也還落在美東 19:00~23:00 尖峰內」的排法。
    # 現行三班換算美東：19:37 / 21:17 / 22:02；最壞情況(延遲 100 分)→ 21:17 / 22:57 / 23:42。
    # ⚠️ 繼續避開 UTC 00:00~00:30 這個全球最壅塞的時段(前次教訓：那班會被直接丟棄而不是延後)。
    - cron: '37 23 * * *'
    - cron: '17 1 * * *'
    - cron: '2 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-pin
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post next queued pin via Make.com
        env:
          MAKE_TOKEN: ${{ secrets.MAKE_TOKEN }}
        run: python3 scripts/post_pin.py
      - name: Commit queue state
        run: |
          git config user.name "fnf-pins bot"
          git config user.email "actions@github.com"
          git add queue posted
          git diff --cached --quiet || git commit -m "pin posted $(date -u +%Y-%m-%d)"
          git push
