name: Post Pin

on:
  schedule:
    # ── 排程策略（2026-10-06 第三次改；前兩次的踩坑史在下面，別回頭用固定三班）──
    # 現行做法：排一排「候補班次」，發不發由 scripts/post_pin.py 的窗口守門當場決定。
    # 每班執行時看真實美東時間，不在 19:00~23:00（Pinterest 晚間尖峰）就直接跳過；
    # 當天發滿 3 張後面班次也自動跳過。所以 GitHub Actions 延遲多久都不影響落點。
    #
    # 候補班次 = UTC 17:37~02:37 每小時一班：
    #   延遲 ~0h → 由 23:37 / 00:37 / 01:37 命中窗口
    #   延遲 ~6h → 由 17:37 / 18:37 / 19:37 命中窗口
    #   中間的延遲量也都有班次覆蓋，守門會把多出來的擋掉。
    # 分鐘固定 :37，避開 UTC 00:00~00:30 這個全球最壅塞時段（那班會被直接丟棄而非延後）。
    # 守門用時區名 America/New_York 而非固定 offset，11 月初 EDT→EST 會自動跟著換。
    #
    # 歷史：
    # 2026-08-05 UTC 04/08/13（台灣 12/16/21）→ UTC 00/02/04。舊時段對應印度早/午/晚，
    #   導致受眾 16.4% 印度、僅 9.3% 美國，而站上推 Amazon.com 美國站 → CTR 9~20% 卻 0 轉換。
    # 2026-08-07 '0 0,2,4' → '7 0,2,4'：UTC 00:00 那班連 3 天完全沒觸發。
    # 2026-08-10 查明問題不在「整點」而在「UTC 00 點時段」本身，免費排程會被丟棄而非延後。
    # 2026-08-12 改 '37 23' / '17 1' / '2 2'，原則是「就算延遲 100 分鐘也還落在窗口內」。
    # 2026-10-06 那個原則破了：延遲從 100 分鐘惡化到 5~6 小時。實測 10/02~10/06 落點 UTC
    #   02:17~08:36，換算美東只有第一班勉強在窗口邊緣，後兩班固定落在凌晨 02:30~04:30
    #   —— 每天 3 張有 2 張白發，8/05 的受眾策略實際上只有 1/3 生效。
    #   教訓：別再用「排程時間 + 預估延遲」推落點，延遲量會漂。改由執行當下的守門判定。
    - cron: '37 17-23 * * *'
    - cron: '37 0-2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略發佈窗口，立刻發一張（補發用）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-pin
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post next queued pin via Make.com
        env:
          MAKE_TOKEN: ${{ secrets.MAKE_TOKEN }}
          # schedule 觸發時 inputs.force 是空值 → falsy → '0'
          FORCE_POST: ${{ inputs.force && '1' || '0' }}
        run: python3 scripts/post_pin.py
      - name: Commit queue state
        run: |
          git config user.name "fnf-pins bot"
          git config user.email "actions@github.com"
          git add queue posted
          git diff --cached --quiet || git commit -m "pin posted $(date -u +%Y-%m-%d)"
          git push
